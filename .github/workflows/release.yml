# نشر إلى TestFlight من Mac سحابي بلا أي جهاز Mac محلي.
# التوقيع سحابي عبر مفتاح App Store Connect API (Xcode Managed signing مع -allowProvisioningUpdates).
#
# الأسرار المطلوبة في GitHub → Settings → Secrets and variables → Actions:
#   ASC_KEY_ID          معرّف مفتاح App Store Connect API (Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID       Issuer ID من الصفحة نفسها
#   ASC_KEY_P8_BASE64   محتوى ملف AuthKey_XXXX.p8 مشفّرًا base64 (على Windows: certutil -encode)
#   APPLE_TEAM_ID       معرّف الفريق (10 أحرف)
#   GOOGLE_MAPS_IOS_KEY مفتاح Maps/Navigation SDK المقيّد بـ Bundle ID
#   BZ_APP_KEY          مفتاح التطبيق للخادم الخلفي
#   BZ_BACKEND_URL      رابط الخادم الخلفي HTTPS (مثل https://api.bedoonzahma.sa)
#
# يجب أن يكون التطبيق مُنشأً في App Store Connect بـ Bundle ID: sa.mishwarak.app
name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "رقم البناء (يُترك فارغًا لاستخدام رقم التشغيل)"
        required: false
        default: ""

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen & xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Write Secrets.xcconfig
        working-directory: BedoonZahma
        run: |
          cat > Config/Secrets.xcconfig <<EOF
          GOOGLE_MAPS_IOS_KEY = ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
          BZ_APP_KEY = ${{ secrets.BZ_APP_KEY }}
          BZ_TEAM_ID = ${{ secrets.APPLE_TEAM_ID }}
          EOF
          # رابط الخادم للإنتاج — في xcconfig يبدأ "//" تعليقًا، لذا نكسر الشرطتين بـ $()
          ESCAPED_URL="$(printf '%s' '${{ secrets.BZ_BACKEND_URL }}' | sed 's#://#:/$()/#')"
          sed -i '' "s#^BZ_BACKEND_URL = .*#BZ_BACKEND_URL = ${ESCAPED_URL}#" Config/Release.xcconfig
          grep -n "BZ_BACKEND_URL" Config/Release.xcconfig

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # توقيع يدوي: شهادة Apple Distribution (P12) + ملف تزويد App Store أُنشئا عبر ASC API.
      # (مفتاح API الحالي بدور App Manager بلا إذن «Cloud Managed Distribution Certificate»، فالتوقيع السحابي غير متاح له.)
      - name: Install signing certificate & provisioning profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed profile $UUID"

      - name: Generate project
        working-directory: BedoonZahma
        run: xcodegen generate

      - name: Set build number
        working-directory: BedoonZahma
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist || true
          echo "Build number: $BUILD_NUMBER"

      - name: Archive (Release)
        working-directory: BedoonZahma
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BedoonZahma.xcodeproj \
            -scheme BedoonZahma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/BedoonZahma.xcarchive \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            2>&1 | tee ../archive.log | xcbeautify --renderer github-actions

      - name: Export & upload to App Store Connect
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>sa.mishwarak.app</key><string>${{ secrets.IOS_PROFILE_NAME }}</string>
            </dict>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/BedoonZahma.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            2>&1 | tee export.log | xcbeautify --renderer github-actions

      - name: Show errors (on failure)
        if: failure()
        run: grep -n -E "error:|BUILD FAILED|ARCHIVE FAILED|EXPORT FAILED" archive.log export.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs
          path: |
            archive.log
            export.log
            build/export/*.plist
