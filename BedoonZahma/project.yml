# XcodeGen spec — على Mac: `brew install xcodegen && xcodegen generate` ثم افتح BedoonZahma.xcodeproj
name: BedoonZahma
options:
  bundleIdPrefix: sa.mishwarak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  developmentLanguage: ar
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  BedoonZahmaKit:
    path: Packages/BedoonZahmaKit
  # Navigation SDK يتضمن Maps SDK (ios-maps-sdk 11.2.0) كاعتماد. لا نستخدم Places SDK للهاتف؛ Places API (New) عبر الخادم.
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    exactVersion: 11.2.0
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.2.0

targets:
  BedoonZahma:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/*.md"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: مشوارك أسهل
        CFBundleName: BedoonZahma
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        ITSAppUsesNonExemptEncryption: false
        # خط الهوية (Noto Kufi Arabic — رخصة OFL، الملف في App/Fonts ويُنسخ إلى جذر الحزمة)
        UIAppFonts: [NotoKufiArabic-Variable.ttf]
        NSLocationWhenInUseUsageDescription: "نستخدم موقعك أثناء استخدام التطبيق فقط لحساب الطرق وإظهار الأماكن التي تصل إليها خلال دقائق. لا نخزّن سجل مواقعك."
        UIBackgroundModes: [location, audio]
        # NSAllowsLocalNetworking يسمح بـ http://127.0.0.1 للخادم المحلي في التطوير فقط؛ الإنتاج HTTPS.
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false, NSAllowsLocalNetworking: true }
        # تُحقن من xcconfig — لا تضع مفاتيح حقيقية هنا.
        GoogleMapsIOSKey: $(GOOGLE_MAPS_IOS_KEY)
        BZBackendURL: $(BZ_BACKEND_URL)
        BZAppKey: $(BZ_APP_KEY)
        BZUseMocks: $(BZ_USE_MOCKS)
        BZMapsProvider: $(BZ_MAPS_PROVIDER)
    entitlements:
      path: App/BedoonZahma.entitlements
      properties: {}
    dependencies:
      - package: BedoonZahmaKit
        products: [Domain, Features, GoogleProviders, TomTomProviders, DevMocks, Location, Storage, Analytics, RemoteConfig, BackendClient, Networking, TrafficEngine, PlaceRanking, NearbyDiscovery, DesignSystem]
      - package: GoogleNavigation
        product: GoogleNavigation
      - package: GoogleMaps
        product: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.mishwarak.app
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        OTHER_LDFLAGS: ["-ObjC"]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BZ_TEAM_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          # توقيع يدوي لهدف التطبيق فقط (حزم Swift لا تقبل ملفات تزويد). الشهادة والملف من أسرار CI.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Mishwarak AppStore"

  BedoonZahmaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BedoonZahma
    settings:
      base:
        TEST_TARGET_NAME: BedoonZahma

schemes:
  BedoonZahma:
    build:
      targets:
        BedoonZahma: all
        BedoonZahmaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BedoonZahmaUITests
        - package: BedoonZahmaKit/TrafficEngineTests
        - package: BedoonZahmaKit/PlaceRankingTests
        - package: BedoonZahmaKit/NearbyDiscoveryTests
        - package: BedoonZahmaKit/GoogleProvidersTests
    archive:
      config: Release
